<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

</head><style>
        body{
       /* background: linear-gradient(90deg, #da09ff 100%,#ff0199 100%); */
background-image: url("{{ url_for('static', filename='background.png') }}");
    
    /* 2. Add these rules so the image looks good! */
    background-size: cover;       /* Stretches the image to fit the whole screen */
    background-position: center;  /* Keeps the image centered */
    background-repeat: no-repeat; /* Stops the image from tiling like a mosaic */
    background-attachment: fixed; /* Makes the background stay still when you scroll down */
    
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #333;
    line-height: 1.6;
}

    .card {
    border: 2px solid black;
    background: #ffffff;
    width: 400px;
    border-radius: 40px;            
    margin-left: auto;
    margin-right: auto;
    margin-top: 50px;
}

    .card-body{
        padding: 2rem;
        margin-left: auto;
    margin-right: auto;
        }
</style>
<body>
<div class="card">
      <div class="card-body">

<h2>Student registration form</h2>

<form method="POST" action="/register/student">
        <label>Scholar ID:</label><br>
        <input type="text" name= "scholar_id" placeholder="enter your scholar id" required><br><br>
        <label>Full Name:</label><br>
        <input type="text" name= "name" placeholder="enter your full name" required><br><br>
        <label>Email:</label><br>
        <input type="email" name="email" placeholder="enter your email id" required><br><br>
        <label>Password:</label><br>
        <input type="password" name="password"  placeholder="enter the password- at max 5 length" required><br><br>
        <label>Degree (e.g., BS, BTech):</label><br>
        <input type="text" name="degree"  placeholder="enter the degree you are enrolled in" required><br><br>
        <label>Skills (comma separated):</label><br>
        <input type="text" name="skills"><br><br>
        <button type="submit">Register</button>
                <a href="http://127.0.0.1:5001/login">Back to login</a>

</form>  
</div>
</div>               
</body>       
</html>
