<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company registration</title>
</head>
<style>
    body{
background-image: url("{{ url_for('static', filename='background.png') }}");
    
    background-size: cover;       
    background-position: center;  
    background-repeat: no-repeat; 
    background-attachment: fixed; 
    
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #333;
    line-height: 1.6;
}

       
    .card {
    border: 2px solid black;
    background: #ffffff;
    width: 500px;
    border-radius: 40px;            
    margin-left: auto;
    margin-right: auto;
    margin-top: 50px;
    margin-bottom: 20px;
    box-shadow: #333 ;
}

    .card-body{
        padding: 2rem;
        margin-left: auto;
    margin-right: auto;
        }
</style>
<body>
    <div class="card">
      <div class="card-body">
    <h1>Company Registration Form</h1>
    <h4>Note: New company registration needs admin approval.</h4>
    <form method="POST" action="/register/company">
        <label class="form-label fw-bold">Company id:</label><br>
        <input type="text" class="form-control" name="company_id" placeholder="enter unique id given by college" required><br>
        <label class="form-label fw-bold" >Company Name:</label><br>
        <input type="text" name="name"  class="form-control"  placeholder="enter your company's name" required><br><
        <label class="form-label fw-bold" >Email:</label><br>
        <input type="email" class="form-control" name="email"  placeholder="enter your company's poc email id" required><br>
        <label class="form-label fw-bold" >Password:</label><br>
        <input type="password" class="form-control" name="password"  placeholder="enter your password" required><br>
        <button type="submit">Submit for approval</button>

    </form>
    <a href="/login" class="btn btn-primary mt-3">Back to login</a>
</div>
</div>

</body>
</html>
