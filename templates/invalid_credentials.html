<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invalid Credentials</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #030a1b; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .error-card {
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid #000000;
            border-radius: 16px;
            box-shadow: 0 2px 50px #000000;
            color: white;
        }
        .i{
            height:100px;
            width: 100px;
        }
    </style>
</head>

<body class="vh-100 d-flex align-items-center justify-content-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="error-card p-5 text-center">
                    
                    <h2 class="fw-bold mb-3"><i class="bi bi-ban"></i><br>Uh Oh!Access Denied!</h2>
                    
                    <p class="fs-5 mb-4 opacity-75">
                        The credentials you entered are invalid. Please recheck your details or contact the TNP cell for assistance.
                    </p>
                    
                    <a href="/login" class="btn btn-light btn-lg fw-bold px-5 rounded-pill shadow-sm">
                        Try Again
                    </a>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
