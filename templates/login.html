<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Portal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
            padding: 40px;
        }

        .btn-purple {
            background-color:#7b5cfa;
            color: white;
            border: none;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
        }

        .btn-purple:hover {
            background-color: #6546df;
            color: white;
        }
        
        .hero-side {
            background-color: #7b5cfa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
    </style>
</head>
<body>
<div class="container-fluid vh-100">
    <div class="row h-100">
        
        <div class="col-lg-6 d-flex align-items-center justify-content-center">
            <div class="login-container">
                <h2 class="fw-bold mb-2">Welcome back</h2>
                <p class="text-muted mb-4">Please enter your details to access your account.</p>

                <form method="POST" action="/login">
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold small">I am logging in as a:</label>
                        <select name="role" class="form-select" required>
                            <option value="" disabled selected>Select your role...</option>
                            <option value="student">Student</option>
                            <option value="company">Company</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">Email (or Scholar ID if student)</label>
                        <input type="text" name="identifier" class="form-control" placeholder="Enter your email or ID" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Password" required>
                    </div>
                    <br><br>

                    <button type="submit" class="btn btn-purple w-100 mb-3">Sign in</button>
                    
                </form>
                <p class="text-center small text-muted">
                    Don't have an account? <br>
                    <a href="/register/student" style="color: #7b5cfa; font-weight: bold; ">Register as Student</a> | 
                    <a href="/register/company" style="color: #7b5cfa; font-weight: bold;">Register as Company</a>
                </p>

            </div>
        </div>

        <div class="col-lg-6 d-none d-lg-flex hero-side">
            <div class="text-center px-5">
                <img src="{{ url_for('static',filename='iitmlogo.png') }}" alt="IITM Logo" width="450" class="mb-4">
                <h1 class="fw-bold mb-3">Your Future is safe at IITM.</h1>            </div>
        </div>

    </div>
</div>

</body>
</html>
