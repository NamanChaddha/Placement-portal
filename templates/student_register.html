<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

</head><style>
        body{
background-image: url("{{ url_for('static', filename='background.png') }}");
    
    background-size: cover;       
    background-position: center;  
    background-repeat: no-repeat; 
    background-attachment: fixed; 
    
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #333;
    line-height: 1.6;
}

    .card {
    border: 2px solid black;
    background: #ffffff;
    width: 400px;
    border-radius: 40px;            
    margin-left: auto;
    margin-right: auto;
    margin-top: 50px;
}

    .card-body{
        padding: 2rem;
        margin-left: auto;
    margin-right: auto;
        }
</style>
<body>
<div class="card">
      <div class="card-body">

<h2>Student registration form</h2>

<form method="POST" action="/register/student">
        <label class="form-label fw-bold">Scholar ID:</label><br>
        <input type="text" name= "scholar_id" class="form-control" placeholder="enter your scholar id" required><br>
                <label class="form-label fw-bold">Full Name:</label>
                <input type="text" class="form-control" name="name" required>
            
                <label class="form-label fw-bold">Email:</label>
                <input type="email" class="form-control" name="email" required>
            
                <label class="form-label fw-bold">Password:</label>
                <input type="password" class="form-control" name="password" required>

                <label class="form-label fw-bold">Degree:</label>
                <select name="degree" class="form-select" required>
                    <option value="" disabled selected>Select your degree...</option>
                    <option value="BTech">BTech</option>
                    <option value="MTech">MTech</option>
                    <option value="BCA">BCA</option>
                    <option value="MCA">MCA</option>
                    <option value="MBA">MBA</option>
                </select>

                <label class="form-label fw-bold">Branch:</label>
                <select name="branch" class="form-select" required>
                    <option value="" disabled selected>Select your branch...</option>
                    <option value="CSE">CSE</option>
                    <option value="IT">IT</option>
                    <option value="ECE">ECE</option>
                    <option value="MECH">MECH</option>
                    <option value="CIVIL">CIVIL</option>
                    <option value="OTHER">Other</option>
                </select>

                <label class="form-label fw-bold">Current CGPA:</label>
                <input type="number" step="0.01" min="0" max="10" class="form-control" name="cgpa" placeholder="e.g. 8.5" required>
            
                <label class="form-label fw-bold d-block">Skills:</label>
                
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="skills" value="Python" id="skillPython">
                    <label class="form-check-label" for="skillPython">Python</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="skills" value="C++" id="skillCpp">
                    <label class="form-check-label" for="skillCpp">C++</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="skills" value="Web Dev" id="skillWeb">
                    <label class="form-check-label" for="skillWeb">Web Dev</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="skills" value="SQL" id="skillSQL">
                    <label class="form-check-label" for="skillSQL">SQL</label>
            </div>
</div>
        <input type="text" class="form-control" name="skills"><br><br>
        <button type="submit">Register</button>
                <a href="/login">Back to login</a>

</form>  
</div>
</div>               
</body>       
</html>
